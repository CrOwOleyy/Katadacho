# Builds the installers when a version tag is pushed (for example v0.1.0) and attaches them to a draft
# GitHub release: the Windows installer (.exe) and the Linux packages (AppImage, .deb, .rpm).
# Review the draft on GitHub, then publish it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check the tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with tauri.conf.json
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version ${version}. Tag v${version}, or update the version first."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            bundles: nsis
          # The oldest supported Ubuntu, so the AppImage runs on as many distributions as possible.
          - name: Linux packages
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libgtk-layer-shell-dev libfuse2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build and attach to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Katadacho ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            - **Windows:** `katadacho_*_x64-setup.exe`. It includes WebView2 and installs for your user, without administrator rights. The installer is not code-signed yet, so Windows may show an "unknown publisher" warning: choose **More info**, then **Run anyway**.
            - **Linux:** the `.AppImage` runs on most distributions (`chmod +x`, then run it). Use the `.deb` on Debian and Ubuntu, and the `.rpm` on Fedora.

            See the [README](https://github.com/CrOwOleyy/Katadacho#readme) for what each platform supports.
          releaseDraft: true
          prerelease: false
